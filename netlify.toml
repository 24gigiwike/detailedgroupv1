# Temporary maintenance gate. Runs before static files.
# To disable, set MAINTENANCE to false in netlify/edge-functions/maintenance.js.
[[edge_functions]]
  function = "maintenance"
  path = "/*"

# HTML stays revalidated. Unversioned static files cache for a week.
# Netlify compresses text responses on its CDN; these rules do not change that.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ouro"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ouro/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ouro/*/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/ouro/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon_io/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Earlier OURO chapter URLs. Launch is now its own page.
[[redirects]]
  from = "/ouro/story"
  to = "/ouro/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/story/"
  to = "/ouro/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/vision"
  to = "/ouro/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/vision/"
  to = "/ouro/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/identity"
  to = "/ouro/brand-identity/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/identity/"
  to = "/ouro/brand-identity/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/creative-direction"
  to = "/ouro/"
  status = 301
  force = true

[[redirects]]
  from = "/ouro/creative-direction/"
  to = "/ouro/"
  status = 301
  force = true

