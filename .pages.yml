media:
  - name: project-images
    label: Project images
    input: media/projects
    output: /media/projects
    categories: [image]
    rename: safe

components:
  imageWithText:
    label: Image
    type: object
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: project-images
          extensions: [jpg, jpeg, png, webp, gif, avif]
      - name: alt
        label: Alt text
        type: string
        required: true
        description: Describe the image. Do not use the filename or a client name that is not approved for publication.
      - name: caption
        label: Caption
        type: string

content:
  - name: marquee_settings
    label: "Header Marquee"
    type: file
    path: "data/marquee.json"
    fields:
      - name: items
        label: "Events List"
        type: object
        list: true
        fields:
          - name: text
            label: "Event Text"
            type: text
            placeholder: "EXECUTIVE COMMUNICATIONS FORUM • JUNE 25"
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{fields.slug}.json"
    subfolders: false
    exclude: ["README.md", ".gitkeep"]
    view:
      primary: title
      fields: [title, status, featured, sortOrder]
      sort: [sortOrder, title]
      search: [title, summary]
      default:
        sort: sortOrder
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Lowercase words separated by hyphens. This becomes /work/<slug>/.
      - name: id
        label: ID
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Stable identifier. Use the same value as the slug unless an existing project already has another id.
      - name: summary
        label: Summary
        type: text
        required: true
      - name: description
        label: Overview
        type: text
        description: Optional overview shown above the content blocks.
      - name: category
        label: Primary category
        type: select
        required: true
        options:
          values:
            - name: executive-communications
              label: Executive Communications
            - name: internal-communications
              label: Internal Communications
            - name: presentation-systems
              label: Presentation Systems
            - name: organizational-storytelling
              label: Organizational Storytelling
      - name: services
        label: Services
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - name: executive-communications
              label: Executive Communications
            - name: internal-communications
              label: Internal Communications
            - name: presentation-systems
              label: Presentation Systems
            - name: organizational-storytelling
              label: Organizational Storytelling
        description: Include the primary category, then any other competencies actually part of the work.
      - name: industry
        label: Industry
        type: string
      - name: clientVisibility
        label: Client visibility
        type: select
        required: true
        options:
          values:
            - name: public
              label: Public
            - name: confidential
              label: Confidential
        description: Pages CMS cannot hide fields conditionally. Leave the client name empty for confidential work. The validator rejects a stored client name or logo on confidential projects.
      - name: clientName
        label: Public client name
        type: string
        description: Only for public projects, and only after the name is approved. Never enter a confidential legal name.
      - name: clientDescriptor
        label: Anonymous client description
        type: string
        description: Required before a confidential project is published. Use a sector description, not a legal name.
      - name: clientLogo
        label: Public client logo
        component: imageWithText
      - name: coverImage
        label: Cover image
        component: imageWithText
        description: Required before publishing. Leave empty while approved artwork is pending.
      - name: heroImage
        label: Hero image
        component: imageWithText
      - name: completionDate
        label: Completion date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: Optional. Leave empty while the project is ongoing. Use a real completion date only.
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: sortOrder
        label: Sort order
        type: number
        required: true
        description: Unique whole number. Lower numbers appear first. Featured projects are grouped before the rest.
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Draft
            - name: published
              label: Published
        description: Drafts stay in the repository but are not written to the public work pages. There is no separate Pages CMS publishing workflow.
      - name: seoTitle
        label: SEO title
        type: string
      - name: seoDescription
        label: SEO description
        type: text
      - name: ogImage
        label: Social image
        component: imageWithText
      - name: blocks
        label: Content blocks
        type: block
        list:
          collapsible: true
        blockKey: type
        description: Blocks render in this list order. Use image blocks for pictures so every image has alt text.
        blocks:
          - name: narrative
            label: Narrative
            fields:
              - name: text
                label: Text
                type: rich-text
                required: true
                options:
                  format: markdown
                  media: false
          - name: heading
            label: Section heading
            fields:
              - name: text
                label: Heading
                type: string
                required: true
          - name: workstream
            label: Workstream
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: summary
                label: Summary
                type: text
                required: true
              - name: text
                label: Detail
                type: rich-text
                options:
                  format: markdown
                  media: false
          - name: image
            label: Full-width image
            component: imageWithText
          - name: image-pair
            label: Two-column images
            fields:
              - name: primary
                label: Left image
                component: imageWithText
              - name: secondary
                label: Right image
                component: imageWithText
          - name: gallery
            label: Gallery
            fields:
              - name: images
                label: Images
                type: object
                list:
                  min: 1
                  max: 24
                fields:
                  - name: src
                    label: Image
                    type: image
                    required: true
                    options:
                      media: project-images
                      extensions: [jpg, jpeg, png, webp, gif, avif]
                  - name: alt
                    label: Alt text
                    type: string
                    required: true
                  - name: caption
                    label: Caption
                    type: string
          - name: video
            label: Video
            fields:
              - name: url
                label: Video URL
                type: string
                required: true
                description: Use an https YouTube, Vimeo, or direct mp4, webm, ogg, or ogv URL.
              - name: caption
                label: Caption
                type: string
          - name: quote
            label: Quote
            fields:
              - name: text
                label: Quote
                type: text
                required: true
                description: Use only an approved quotation. Do not draft a testimonial.
              - name: attribution
                label: Attribution
                type: string
              - name: role
                label: Role
                type: string
